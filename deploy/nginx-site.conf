# PDCA Core — Nginx 反代模板
# 架构：Nginx -> 127.0.0.1:3000（node 只监听本地，systemd 托管）
#
# 用法：
#   cp deploy/nginx-site.conf /etc/nginx/sites-available/pdca-core
#   ln -sf /etc/nginx/sites-available/pdca-core /etc/nginx/sites-enabled/pdca-core
#   # 把下面两处 your-domain.com 换成自己的域名，再：
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d your-domain.com --non-interactive --agree-tos -m you@example.com

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # ACME 验证路径（certbot 签发证书用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $scheme 而不是写死 http：服务端据此判断是否给会话 Cookie 加 Secure
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
